---
- name: Install Java 17
  ansible.builtin.dnf:
    name: java-17-openjdk-headless
    state: present

- name: Create Kafka user
  ansible.builtin.user:
    name: kafka
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Create Kafka installation directory
  ansible.builtin.file:
    path: /opt/kafka
    state: directory
    owner: kafka
    group: kafka
    mode: "0755"

- name: Download Kafka
  ansible.builtin.get_url:
    url: "https://downloads.apache.org/kafka/3.7.0/kafka_2.13-3.7.0.tgz"
    dest: "/tmp/kafka-3.7.0.tgz"
    mode: "0644"
