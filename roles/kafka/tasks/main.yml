---
- name: Install Java 17
  ansible.builtin.dnf:
    name: java-17-openjdk-headless
    state: present

- name: Create Kafka user
  ansible.builtin.user:
    name: kafka
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Download Kafka
  ansible.builtin.get_url:
    url: "https://downloads.apache.org/kafka/3.7.0/kafka_2.13-3.7.0.tgz"
    dest: "/tmp/kafka-3.7.0.tgz"
    mode: "0644"

- name: Extract Kafka
  ansible.builtin.unarchive:
    src: "/tmp/kafka-3.7.0.tgz"
    dest: "/opt"
    remote_src: true
    creates: "/opt/kafka_2.13-3.7.0"

- name: Create Kafka symlink
  ansible.builtin.file:
    src: "/opt/kafka_2.13-3.7.0"
    dest: /opt/kafka
    state: link
    force: true

- name: Create Kafka data directory
  ansible.builtin.file:
    path: /var/lib/kafka
    state: directory
    owner: kafka
    group: kafka
    mode: "0755"

- name: Create Kafka configuration
  ansible.builtin.template:
    src: server.properties.j2
    dest: /opt/kafka/config/kraft/server.properties
    owner: kafka
    group: kafka
    mode: "0644"

- name: Create Kafka systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/kafka.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Apache Kafka
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=kafka
      Group=kafka
      ExecStart=/opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable Kafka
  ansible.builtin.systemd:
    name: kafka
    enabled: true
